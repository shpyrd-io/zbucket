project: warehouse
exposure: external
globals: false
env:
  NODE_ENV: production
  WAREHOUSE_ACCESS: shpyrd
  APP_ORIGIN: https://platform-warehouse.shpyrd.app
  VOYAGE_MODEL: voyage-4
build:
  stack: full
  env:
    BP_NODE_VERSION: "24.*"
    BP_NODE_RUN_SCRIPTS: build
processes:
  web:
    size: shared-l
    healthCheck:
      path: /api/health
      gracePeriod: 90s
  worker:
    size: shared-m
